spring.application.name=post-service

###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
database.ip = ${POST_DB_IP:localhost}
database.port = ${POST_DB_PORT:6005}
database.user = ${POSTGRES_USER:postgres}
database.password = ${POSTGRES_PASSWORD:postgres}
database.name = ${POST_DB:review_db}

spring.sql.init.platform=postgres
spring.datasource.url=jdbc:postgresql://${database.ip}:${database.port}/${database.name}
spring.datasource.username=${database.user}
spring.datasource.password=${database.password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

###############################################
### RABBITMQ CONFIGURATIONS ###
###############################################
spring.rabbitmq.host=${BROKER_HOST:localhost}
spring.rabbitmq.port=${BROKER_PORT:6672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8086}
server.address=0.0.0.0

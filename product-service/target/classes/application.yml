server:
  port: 8084

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://${DB_IP:localhost}:${DB_PORT:5432}/${DB_DBNAME:product_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:222819}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${BROKER_HOST:localhost}
    port: ${BROKER_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:super-secret-demo-key-change-me!}
  rabbitmq:
    exchanges:
      product: product.exchange
    queues:
      es-sync: product.es.sync.queue
      order-reserve: product.order.reserve.queue
      order-release: product.order.release.queue
    routing-keys:
      es-sync: product.es.sync
      order-reserve: product.order.reserve
      order-release: product.order.release
  elasticsearch:
    outbox:
      batch-size: 50
      scheduler-delay-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.merkador.productservice: DEBUG